name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow running the suite by hand, e.g. before cutting a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux is the deployment target; Windows is where development
        # happens, and the platform-specific files (Maildir flag
        # separator, signal handling) only diverge there — so both are
        # worth keeping green.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt -s formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The race detector needs a C toolchain, which is reliable on the
      # Linux runners; Windows runs the plain suite.
      - name: go test (race)
        if: runner.os == 'Linux'
        run: go test ./... -race -count=1

      - name: go test
        if: runner.os != 'Linux'
        run: go test ./... -count=1

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The release ships static binaries for both architectures, so a
      # build break on either must fail the branch, not the release.
      - name: build linux/amd64 and linux/arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/kavira-amd64 ./cmd/kavira
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/kavira-arm64 ./cmd/kavira
          file /tmp/kavira-amd64 /tmp/kavira-arm64

      # A binary that cannot validate its own shipped configuration is
      # broken in a way the unit tests do not catch.
      - name: smoke test the built binary
        run: |
          /tmp/kavira-amd64 version
          /tmp/kavira-amd64 check-config \
            --config internal/bootstrap/skel/etc/kavira/config.yaml
          # audit is expected to report findings here (a checked-out
          # config has repository permissions, not production ones);
          # what matters is that it runs to completion.
          /tmp/kavira-amd64 audit \
            --config internal/bootstrap/skel/etc/kavira/config.yaml \
            || test $? -eq 1

  # The documented installation path, executed exactly as an operator
  # would: unpack a bundle, provision the system, then remove it. This
  # is the one flow that touches /usr/sbin, /etc and systemd, so it can
  # only be tested on a throwaway machine — which is what a runner is.
  install:
    name: install and purge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: build a bundle the way the release does
        run: |
          mkdir -p bundle
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=ci" \
            -o bundle/kavira ./cmd/kavira
          cp internal/bootstrap/kavira.service bundle/

      - name: init refuses without root
        working-directory: bundle
        run: |
          if ./kavira init; then
            echo "init must not provision the system as an unprivileged user"
            exit 1
          fi

      - name: sudo ./kavira init
        working-directory: bundle
        run: sudo ./kavira init

      - name: the system is provisioned
        run: |
          set -x
          test -x /usr/sbin/kavira
          test -f /etc/kavira/config.yaml
          test -d /etc/kavira/domains
          test -f /etc/kavira/domains/example.com.yaml.example
          test -f /etc/systemd/system/kavira.service
          test -d /var/lib/kavira/queue
          test -d /var/lib/kavira/dkim
          test -d /var/log/kavira
          # The installed binary is the one that was just built.
          [ "$(/usr/sbin/kavira version)" = "kavira ci" ]
          # Secrets must not be world-readable.
          [ "$(stat -c %a /var/lib/kavira/dkim)" = "700" ]
          [ "$(stat -c %a /etc/kavira/config.yaml)" = "640" ]

      - name: the provisioned configuration is usable
        run: |
          sudo cp /etc/kavira/domains/example.com.yaml.example \
                  /etc/kavira/domains/example.com.yaml
          sudo kavira check-config
          sudo kavira generate-dkim example.com
          sudo kavira audit || test $? -eq 1

      - name: init is idempotent
        working-directory: bundle
        run: |
          sudo ./kavira init | tee out.txt
          grep -q "kept /etc/kavira/config.yaml" out.txt
          # The domain added above must survive a second init.
          test -f /etc/kavira/domains/example.com.yaml

      - name: sudo kavira purge --yes
        run: |
          sudo kavira purge --yes
          for p in /etc/kavira /var/lib/kavira /var/log/kavira \
                   /etc/systemd/system/kavira.service /usr/sbin/kavira; do
            if [ -e "$p" ]; then
              echo "purge left $p behind"
              exit 1
            fi
          done
